<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested list</title>
</head>
<body>
    <ol>
        <li>AC</li>
        <ul type = "disc">
            <li>DBT</li>
            <li>C++</li>
            <li>WPT</li>
        </ul>
        <li>MC</li>
        <ul type = "square">
            <li>DBT</li>
            <li>C++</li>
            <li>Java</li>
        </ul>
        <li>BDA</li>
        <ol type = "i">
            <li>Python</li>
            <li>Linux</li>
            <li>Cloud</li>
        </ol>
        <li>ITISS</li>
        <ol >
            <li>Python</li>
            <li>Linux</li>
            <li>Networking</li>
        </ol>
    </ol>
</body>
</html>
